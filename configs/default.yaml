project:
  name: medvl-rag
  seed: 42

runtime:
  device: auto
  deterministic: true

paths:
  data_dir: data
  output_dir: outputs
  checkpoint_dir: checkpoints

training:
  batch_size: 16
  num_epochs: 10
  learning_rate: 0.0001
  num_workers: 4

retrieval:
  embedding_dim: 256
  top_k:
    - 1
    - 5
    - 10
logging:
  level: INFO
  filename: run.log

encoder:
  name: biomedclip
  device: auto
  batch_size: 2
  model_name: hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
