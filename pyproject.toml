[build-system]
requires = [
  "hatchling>=1.25,<2",
]
build-backend = "hatchling.build"


[project]
name = "medvl-rag"
version = "0.1.0"
description = "Vision-language representation learning for medical image retrieval and report grounding."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }

authors = [
  { name = "Muhammed Abdelnaby Sadek" },
]

keywords = [
  "medical imaging",
  "vision-language models",
  "multimodal learning",
  "information retrieval",
  "radiology",
  "retrieval-augmented generation",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
  "typer>=0.12,<1",
]


[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "types-PyYAML>=6,<7",
]

models = [
  "huggingface-hub>=0.20,<1.0",
  "open-clip-torch==2.23.0",
  "transformers==4.35.2",
]


[project.scripts]
medvl-rag = "medvl_rag.cli:app"


[project.urls]
Repository = "https://github.com/el-gabry/medvl-rag"
Issues = "https://github.com/el-gabry/medvl-rag/issues"


[tool.hatch.build.targets.wheel]
packages = [
  "src/medvl_rag",
]


[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]


[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "src",
  "tests",
]
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "checkpoints",
  "data",
  "outputs",
]


[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true


[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
exclude = [
  "^outputs/",
  "^checkpoints/",
  "^data/",
]


[tool.coverage.run]
branch = true
source = [
  "medvl_rag",
]


[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2